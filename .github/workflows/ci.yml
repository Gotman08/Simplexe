name: Linux validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OR-Tools/requirements.txt
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libglpk-dev
      - name: Install Python dependencies
        run: python -m pip install -r OR-Tools/requirements.txt
      - name: Build and check C and Python against exact references
        env:
          PYTHON: python
        run: bash bench/run.sh
